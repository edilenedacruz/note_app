default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: 127.0.0.1
  port: 5432
  username: postgres
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: note_app_development

test:
  <<: *default
  database: note_app_test